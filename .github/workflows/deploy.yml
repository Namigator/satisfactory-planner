name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site files
        run: |
          mkdir dist
          cp -r index.html css js img dist/

      - uses: xpodev/site-manager-deploy@v1
        with:
          url: https://ssma-deploy.xpo.dev
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: dist
          site: satisfactory-planner
